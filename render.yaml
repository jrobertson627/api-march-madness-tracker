services:
  - type: web
    name: api-march-madness-tracker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker with threads, so the in-memory caches are shared. A free instance has little CPU.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: STORE
        value: postgres
      - key: DATABASE_URL
        sync: false # the READ-ONLY api_reader connection string; set in the Render dashboard, never commit it
      - key: CORS_ORIGINS
        sync: false # the frontend's address(es), comma separated
